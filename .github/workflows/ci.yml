name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

      # Ověřená odpověď musí mít doložitelný zdroj. Kontrola
      # čte doslovné texty předpisů z predpisy/.
      - name: Klíč odpovědí je doložitelný
        run: python3 -I scripts/check_answers.py
      - run: npm run build

      # Banka se nesmí rozejít se zdrojem nepozorovaně. Import se pustí znovu
      # a výsledek se porovná s tím, co je v gitu.
      #
      # POZOR: na ubuntu-latest tahle kontrola **neproběhne**. Převod .doc na
      # text dělá textutil, který je jen na macOS, takže krok skončí u
      # konverze a dál se nedostane. Dokud konvertor není přenositelný, je
      # tenhle krok v CI jen hlášením, ne ověřením — reprodukovatelnost
      # importu se zatím ověřuje ručně na macOS. Nenahrazovat konvertor bez
      # porovnání banky bajt po bajtu: jiný nástroj zalomí text jinak a
      # vyrobí jinou banku.
      - name: Import je reprodukovatelný (na ubuntu se přeskočí)
        run: |
          cp src/data/questions.2027.json /tmp/banka-z-gitu.json
          if ! ./scripts/fetch_source.sh; then
            echo "::warning::Zdroj se nepodařilo připravit (na ubuntu chybí textutil) — reprodukovatelnost importu TATO úloha neověřila."
            exit 0
          fi
          python3 -I scripts/import_ticr.py
          if ! diff -q /tmp/banka-z-gitu.json src/data/questions.2027.json; then
            echo "::error::Naimportovaná banka se liší od té v gitu. Zdroj u TIČR se změnil, nebo se změnil importér."
            diff /tmp/banka-z-gitu.json src/data/questions.2027.json | head -40
            exit 1
          fi
        continue-on-error: true

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/ticr:latest
          build-args: VERZE=${{ github.sha }}
          cache-from: type=gha,scope=ticr
          cache-to: type=gha,mode=max,scope=ticr

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Checkout je tu kvůli tělu požadavku: bez něj by se compose soubor
      # neměl odkud vzít a curl by skončil na chybějícím souboru.
      - uses: actions/checkout@v4
      - name: Zavolat nasazovací háček
        env:
          WEBHOOK: ${{ vars.DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::warning::DEPLOY_WEBHOOK nebo DEPLOY_TOKEN chybí — na serveru poběží dál stará verze."
            exit 0
          fi
          # Háček ověřuje X-Deploy-Token, ne Authorization: Bearer.
          #
          # Compose se posílá V TĚLE, ze stejného commitu jako image.
          # Prázdné tělo znamená „nasaď to, co tu leží", takže nová image
          # by se spojila se starým nastavením a chybějící proměnná by se
          # projevila až za běhu. X-Deploy-Poradi dává háčku čím odmítnout
          # starší build, který dorazí pozdě a přepsal by novější produkci.
          curl -fsS -X POST \
            -H "X-Deploy-Token: $TOKEN" \
            -H "X-Deploy-Sha: ${{ github.sha }}" \
            -H "X-Deploy-Poradi: ${{ github.run_number }}" \
            -H "Content-Type: text/plain" \
            --data-binary @deploy/docker-compose.yml \
            "$WEBHOOK"
