# Nasazení statického webu za Traefikem.
#
# Doména je v proměnné DOMENA, ne natvrdo v kódu — aplikace se tím dá předat
# jinému správci bez zásahu do repozitáře. Jméno Traefik routeru natvrdo být
# musí: Compose interpoluje proměnné jen do hodnot, ne do klíčů labelů, a
# router pojmenovaný doslova ${APP_NAME} skončí u self-signed certifikátu.

services:
  ticr:
    image: ghcr.io/${GHCR_OWNER:?chybi GHCR_OWNER}/ticr:latest
    container_name: ticr
    restart: unless-stopped
    environment:
      PORT: 8080
    networks:
      - edge
    # Statika neunese méně než dynamická aplikace, proto 64 MB jako
    # rozcestník, ne 512 MB ze šablony služby.
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.http.routers.ticr.rule: Host(`ticr.${DOMENA:?chybi DOMENA}`)
      traefik.http.routers.ticr.entrypoints: websecure
      traefik.http.routers.ticr.tls.certresolver: le
      traefik.http.services.ticr.loadbalancer.server.port: "8080"

networks:
  edge:
    external: true
